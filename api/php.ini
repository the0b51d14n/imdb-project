; ══════════════════════════════════════════════════════════════════════════════
;  api/php.ini — Supinfo.TV
;  Configuration PHP du runtime Vercel (vercel-php).
;
;  Raison d'être : le runtime tourne sur PHP 8.5 avec display_errors activé par
;  défaut. La moindre notice émise avant session_start() part dans le corps de
;  la réponse, ce qui envoie les en-têtes et empêche le cookie de session d'être
;  posé — l'utilisateur ne peut alors plus rester connecté.
;  Les erreurs sont donc journalisées, jamais affichées.
;
;  Ce fichier est consommé puis retiré par le runtime pendant le build.
; ══════════════════════════════════════════════════════════════════════════════

display_errors = Off
display_startup_errors = Off
log_errors = On

; Les dépréciations de PHP 8.5 sont journalisées mais ne polluent pas les pages.
error_reporting = E_ALL & ~E_DEPRECATED

; Marge pour les appels TMDB en série sur les pages catalogue.
memory_limit = 256M
